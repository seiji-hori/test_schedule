name: Log Execution Time (JST)

on:
  workflow_dispatch:
  schedule:
    # JST 09:00 に実行したい場合 → GitHub Actions は UTC なので 00:00 を指定
    # 1900(JST)に実行
    - cron: "0 10 * * *"

jobs:
  write-time:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write execution time in JST
        run: |
          echo "$(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M:%S JST')" >> execution_log.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add execution_log.txt
          git commit -m "Add execution time (JST)"
          git push
